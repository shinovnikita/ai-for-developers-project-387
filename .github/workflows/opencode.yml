name: OpenCode

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  opencode:
    if: >-
      github.repository == 'shinovnikita/ai-for-developers-project-387' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == 'shinovnikita'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check for an OpenCode command
        id: command
        # Read untrusted comment text as data, never as shell source.
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const allowed = /(?:^|\s)\/(?:oc|opencode)(?=\s|$)/i.test(event.comment.body);
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          NODE

      - name: Check out trusted main
        if: steps.command.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify repository instructions and skills
        if: steps.command.outputs.allowed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          for (const file of [
            'AGENTS.md',
            'docs/agents/domain.md',
            'docs/agents/issue-tracker.md',
            'docs/agents/triage-labels.md',
            'mise.toml',
          ]) assert(existsSync(file), `Missing agent context: ${file}`);

          const skills = readdirSync('.agents/skills').filter((name) =>
            existsSync(`.agents/skills/${name}/SKILL.md`));
          assert(skills.length > 0, 'No repository skills found');
          assert(readFileSync('docs/agents/issue-tracker.md', 'utf8')
            .includes('shinovnikita/ai-for-developers-project-387/issues'));
          assert(readFileSync('AGENTS.md', 'utf8').includes('mise run check'));
          assert(readFileSync('mise.toml', 'utf8').includes('[tasks.check]'));
          console.log(`Available skills (${skills.length}): ${skills.sort().join(', ')}`);
          console.log('Tracker: GitHub Issues, shinovnikita/ai-for-developers-project-387');
          console.log('Checks: mise run check (see README.md for runner setup)');
          NODE

      - name: Install OpenCode 1.19.6 and prepare gh
        if: steps.command.outputs.allowed == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --no-package-lock --no-save opencode-ai@1.19.6
          echo "$RUNNER_TEMP/opencode/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCODE_GH_EXECUTABLE=$(command -v gh)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/opencode-gh"
          install -m 755 scripts/opencode-gh.mjs "$RUNNER_TEMP/opencode-gh/gh"
          echo "$RUNNER_TEMP/opencode-gh" >> "$GITHUB_PATH"

      - name: Run OpenCode
        if: steps.command.outputs.allowed == 'true'
        run: |
          test "$(opencode --version)" = '1.19.6'
          opencode github run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Actions has no permission UI. Keep ordinary tool defaults; reject
          # the built-in approval guards instead of waiting or auto-approving.
          OPENCODE_PERMISSION: '{"external_directory":"deny","doom_loop":"deny","question":"deny","read":{"*.env":"deny","*.env.*":"deny","*.env.example":"allow"}}'
          GH_PROMPT_DISABLED: '1'
          MODEL: openai/gpt-6.1-sol
          VARIANT: medium
          MENTIONS: /oc,/opencode
          SHARE: 'false'
          PROMPT: |
            Выполни запрос из текущего комментария ниже. Прочитай AGENTS.md
            и указанные в нём инструкции репозитория.

            Используй переданный GitHub-wrapper контекст issue и комментариев.
            Не читай GITHUB_EVENT_PATH и внешние служебные файлы раннера:
            необходимые сведения уже есть в контексте. При отказе инструмента
            продолжай доступными средствами; не пытайся обходить запрет.

            Только во время интервью: опубликуй в итоговом ответе краткий разбор
            и ровно один следующий вопрос с рекомендуемым вариантом и причиной,
            затем заверши запуск. Wrapper опубликует ответ комментарием в issue.
            Продолжение интервью придёт новым комментарием пользователя с /oc.
            Интерактивные question и ожидание ответа внутри запуска недоступны.
            Ограничение одного вопроса относится только к интервью: to-spec
            и to-tickets выполняй полностью по соответствующему скиллу.

            Для операций с GitHub используй gh: окружение Actions передаёт ему
            временный токен установленного GitHub App. Не выводи учётные данные.

            Текущий комментарий пользователя:
            ${{ github.event.comment.body }}
