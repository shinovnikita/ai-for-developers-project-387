name: OpenCode

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [OpenCode inline request]
    types: [completed]

permissions: {}

jobs:
  opencode:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'shinovnikita/ai-for-developers-project-387' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      github.event.comment.user.login == 'shinovnikita'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opencode-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check for an OpenCode command
        id: command
        # Read untrusted comment text as data, never as shell source.
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const allowed = /(?:^|\s)\/(?:oc|opencode)(?=\s|$)/i.test(event.comment.body);
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\n`);
          NODE

      - name: Check out trusted main
        if: steps.command.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify repository instructions and skills
        if: steps.command.outputs.allowed == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';

          for (const file of [
            'AGENTS.md',
            'docs/agents/domain.md',
            'docs/agents/issue-tracker.md',
            'docs/agents/triage-labels.md',
            'mise.toml',
          ]) assert(existsSync(file), `Missing agent context: ${file}`);

          const skills = readdirSync('.agents/skills').filter((name) =>
            existsSync(`.agents/skills/${name}/SKILL.md`));
          assert(skills.length > 0, 'No repository skills found');
          assert(readFileSync('docs/agents/issue-tracker.md', 'utf8')
            .includes('shinovnikita/ai-for-developers-project-387/issues'));
          assert(readFileSync('AGENTS.md', 'utf8').includes('mise run check'));
          assert(readFileSync('mise.toml', 'utf8').includes('[tasks.check]'));
          console.log(`Available skills (${skills.length}): ${skills.sort().join(', ')}`);
          console.log('Tracker: GitHub Issues, shinovnikita/ai-for-developers-project-387');
          console.log('Checks: mise run check (see README.md for runner setup)');
          NODE

      - name: Install OpenCode 1.19.6 and prepare gh
        if: steps.command.outputs.allowed == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --no-package-lock --no-save opencode-ai@1.19.6
          echo "$RUNNER_TEMP/opencode/node_modules/.bin" >> "$GITHUB_PATH"
          echo "OPENCODE_GH_EXECUTABLE=$(command -v gh)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/opencode-gh"
          install -m 755 scripts/opencode-gh.mjs "$RUNNER_TEMP/opencode-gh/gh"
          echo "$RUNNER_TEMP/opencode-gh" >> "$GITHUB_PATH"

      - name: Run OpenCode
        if: steps.command.outputs.allowed == 'true'
        run: |
          test "$(opencode --version)" = '1.19.6'
          opencode github run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Actions has no permission UI. Keep ordinary tool defaults; reject
          # the built-in approval guards instead of waiting or auto-approving.
          OPENCODE_PERMISSION: '{"external_directory":"deny","doom_loop":"deny","question":"deny","read":{"*.env":"deny","*.env.*":"deny","*.env.example":"allow"}}'
          GH_PROMPT_DISABLED: '1'
          MODEL: openai/gpt-6.1-sol
          VARIANT: medium
          MENTIONS: /oc,/opencode
          SHARE: 'false'
          PROMPT: |
            Выполни запрос из текущего комментария ниже. Прочитай AGENTS.md
            и указанные в нём инструкции репозитория.

            Используй переданный GitHub-wrapper контекст issue и комментариев.
            Не читай GITHUB_EVENT_PATH и внешние служебные файлы раннера:
            необходимые сведения уже есть в контексте. При отказе инструмента
            продолжай доступными средствами; не пытайся обходить запрет.

            Только во время интервью: опубликуй в итоговом ответе краткий разбор
            и ровно один следующий вопрос с рекомендуемым вариантом и причиной,
            затем заверши запуск. Wrapper опубликует ответ комментарием в issue.
            Продолжение интервью придёт новым комментарием пользователя с /oc.
            Интерактивные question и ожидание ответа внутри запуска недоступны.
            Ограничение одного вопроса относится только к интервью: to-spec
            и to-tickets выполняй полностью по соответствующему скиллу.

            Для операций с GitHub используй gh: окружение Actions передаёт ему
            временный токен установленного GitHub App. Не выводи учётные данные.

            Текущий комментарий пользователя:
            ${{ github.event.comment.body }}

  pr-fix:
    name: pr-fix
    if: >-
      github.repository == 'shinovnikita/ai-for-developers-project-387' &&
      ((github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.type == 'User' &&
        github.event.comment.user.login == 'shinovnikita') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request_review_comment' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login == 'shinovnikita' &&
        github.event.workflow_run.actor.type == 'User' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: opencode-fix-${{ github.repository }}-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write # budget ledger; push uses separately exchanged App token
      pull-requests: read
      issues: read # linked specifications, tickets and human approval
      checks: read
      statuses: read
      actions: read
    outputs:
      proposal-id: ${{ steps.proposal.outputs.artifact-id }}
      proposal-digest: ${{ steps.proposal.outputs.artifact-digest }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check installed infrastructure
        id: installed
        run: |
          if test -f scripts/opencode-pr.mjs; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Infrastructure is not installed in main; no review or correction performed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate command and live PR
        id: context
        if: steps.installed.outputs.ready == 'true'
        run: node scripts/opencode-pr.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Collect data without executing PR code
        if: steps.context.outputs.allowed == 'true'
        run: node scripts/opencode-pr.mjs context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
          HEAD_SHA: ${{ steps.context.outputs.sha }}
          HEAD_BRANCH: ${{ steps.context.outputs.branch }}
          SESSION_KIND: fix
          SESSION_DIR: ${{ runner.temp }}/pr-session
          COMMENT_ID: ${{ steps.context.outputs.commentId }}

      - name: Reserve a session before any model call
        id: budget
        if: steps.context.outputs.allowed == 'true'
        run: >-
          node scripts/opencode-budget.mjs
          --pr "$PR_NUMBER" --sha "$HEAD_SHA" --kind "$SESSION_KIND"
          --output "$RUNNER_TEMP/budget-decision.json"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr }}
          HEAD_SHA: ${{ steps.context.outputs.sha }}
          SESSION_KIND: fix

      - name: Install pinned OpenCode
        if: steps.budget.outputs.allowed == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/opencode" --no-package-lock --no-save opencode-ai@1.19.6
          echo "$RUNNER_TEMP/opencode/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run isolated fresh session
        if: steps.budget.outputs.allowed == 'true'
        run: node scripts/opencode-pr.mjs model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SESSION_DIR: ${{ runner.temp }}/pr-session

      - name: Prepare correction proposal
        if: steps.budget.outputs.allowed == 'true'
        run: node scripts/opencode-candidate.mjs propose
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION_DIR: ${{ runner.temp }}/pr-session
          TRUSTED_SHA: ${{ github.workflow_sha }}

      - name: Upload correction proposal
        id: proposal
        if: steps.budget.outputs.allowed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: correction-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-session/proposal.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain budget decision and session evidence
        if: always() && steps.context.outputs.allowed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fix-pr-${{ steps.context.outputs.pr }}-${{ steps.context.outputs.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/budget-decision.json
            ${{ runner.temp }}/pr-session/meta.json
            ${{ runner.temp }}/pr-session/answer.txt
            ${{ runner.temp }}/pr-session/session.jsonl
            ${{ runner.temp }}/pr-session/session.stderr
          if-no-files-found: warn
          retention-days: 14

  candidate-check:
    name: candidate-check
    needs: pr-fix
    if: needs.pr-fix.outputs.proposal-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # verify producer job and immutable artifact provenance
    outputs:
      checked-id: ${{ steps.checked.outputs.artifact-id }}
      checked-digest: ${{ steps.checked.outputs.artifact-digest }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up trusted mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: '2026.11.0'
          cache: false

      - name: Generate and check candidate in isolated containers
        run: |
          export MISE_BINARY="$(command -v mise)"
          node scripts/opencode-candidate.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          PROPOSAL_ID: ${{ needs.pr-fix.outputs.proposal-id }}
          PROPOSAL_DIGEST: ${{ needs.pr-fix.outputs.proposal-digest }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate

      - name: Upload checked candidate
        id: checked
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: correction-checked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/checked.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain isolated check log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: correction-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/candidate-check.log
          if-no-files-found: warn
          retention-days: 14

  publish-fix:
    name: publish-fix
    needs: [pr-fix, candidate-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read # verify explicit issue links for commit Refs
      actions: read
      id-token: write # App exchange only after candidate proof validation
    env:
      TRUSTED_SHA: ${{ github.workflow_sha }}
      PROPOSAL_ID: ${{ needs.pr-fix.outputs.proposal-id }}
      PROPOSAL_DIGEST: ${{ needs.pr-fix.outputs.proposal-digest }}
      CHECKED_ID: ${{ needs.candidate-check.outputs.checked-id }}
      CHECKED_DIGEST: ${{ needs.candidate-check.outputs.checked-digest }}
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify successful check and complete candidate provenance
        run: node scripts/opencode-candidate.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/verified-candidate

      - name: Exchange App OIDC without a model
        id: app
        run: node scripts/opencode-app-token.mjs

      - name: Commit verified candidate and push to the original PR branch
        run: node scripts/opencode-candidate.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          CANDIDATE_DIR: ${{ runner.temp }}/verified-candidate

      - name: Revoke temporary App token
        if: always() && steps.app.outputs.token != ''
        run: |
          curl --silent --show-error --fail-with-body -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/installation/token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
