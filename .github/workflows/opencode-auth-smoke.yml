# Temporary pre-merge probe; removed before the final PR revision.
name: OpenCode pre-merge smoke
on:
  push:
    branches: [codex/fix-opencode-actions-hang]
    paths: [.github/workflows/opencode-auth-smoke.yml]
permissions:
  contents: read
  id-token: write
jobs:
  smoke:
    if: github.repository == 'shinovnikita/ai-for-developers-project-387' && github.actor == 'shinovnikita'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Read proposed validation files
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/workflows/opencode.yml" > "$RUNNER_TEMP/opencode-proposed.yml"
          git show "$GITHUB_SHA:scripts/opencode-gh.mjs" > "$RUNNER_TEMP/opencode-gh.mjs"
          npm ci --ignore-scripts
      - name: Prepare proposed OpenCode and gh
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const yaml = createRequire(process.cwd()+'/package.json')('js-yaml');
          const workflow = yaml.load(readFileSync(process.env.RUNNER_TEMP+'/opencode-proposed.yml','utf8'));
          const steps = workflow.jobs.opencode.steps;
          const setup = steps.find(s => s.name === 'Install OpenCode 1.19.6 and prepare gh');
          const run = setup.run.replace('install -m 755 scripts/opencode-gh.mjs', 'install -m 755 "$RUNNER_TEMP/opencode-gh.mjs"');
          const result = spawnSync('bash',['-e','-c',run],{stdio:'inherit'});
          if(result.status !== 0) process.exit(result.status ?? 1);
          const agent = steps.find(s => s.name === 'Run OpenCode');
          appendFileSync(process.env.GITHUB_ENV, 'OPENCODE_PERMISSION='+agent.env.OPENCODE_PERMISSION+'\n');
          NODE
      - name: Probe real OpenCode tools and App authorization
        env:
          MODEL: smoke/fake
          SHARE: 'false'
          PROMPT: Run the deterministic permission and gh tool smoke.
          GH_PROMPT_DISABLED: '1'
          OPENCODE_CONFIG_CONTENT: '{"small_model":"smoke/fake","provider":{"smoke":{"npm":"@ai-sdk/openai-compatible","name":"Smoke","options":{"baseURL":"http://127.0.0.1:4098/v1","apiKey":"fixture"},"models":{"fake":{"name":"Fake"}}}}}'
        run: |
          test "$(opencode --version)" = '1.19.6'
          python3 - <<'PY' &
          COMMAND='node --input-type=module -e \'import assert from \'"\'"\'node:assert/strict\'"\'"\';\nimport { spawnSync } from \'"\'"\'node:child_process\'"\'"\';\n\nconst repo = \'"\'"\'shinovnikita/ai-for-developers-project-387\'"\'"\';\nconst runId = process.env.GITHUB_RUN_ID;\nassert(process.env.GITHUB_ACTIONS === \'"\'"\'true\'"\'"\' && /^\\d+$/.test(runId ?? \'"\'"\'\'"\'"\'),\n  \'"\'"\'Smoke must run on GitHub Actions with a run ID\'"\'"\');\nconst title = `[OpenCode auth smoke] run ${runId}`;\nconst body = `Temporary authorization check from OpenCode tools in Actions run ${runId}. This issue will be closed after the check.`;\nconst commentBody = `OpenCode tool authorization write smoke for Actions run ${runId}.`;\n\nfunction gh(args, operation) {\n  const result = spawnSync(\'"\'"\'gh\'"\'"\', args, {\n    encoding: \'"\'"\'utf8\'"\'"\',\n    stdio: [\'"\'"\'ignore\'"\'"\', \'"\'"\'pipe\'"\'"\', \'"\'"\'pipe\'"\'"\'],\n    maxBuffer: 4 * 1024 * 1024,\n    timeout: 60000,\n  });\n  if (result.error || result.status !== 0) {\n    const classification = /403|Resource not accessible|forbidden/i.test(result.stderr ?? \'"\'"\'\'"\'"\')\n      ? \'"\'"\'access denied\'"\'"\' : /401|Bad credentials|authentication|not logged/i.test(result.stderr ?? \'"\'"\'\'"\'"\')\n        ? \'"\'"\'authentication failed\'"\'"\' : \'"\'"\'command failed\'"\'"\';\n    throw new Error(`${operation}: ${classification} (exit ${result.status ?? \'"\'"\'unavailable\'"\'"\'})`);\n  }\n  return result.stdout.trim();\n}\nfunction json(args, operation) {\n  try {\n    return JSON.parse(gh(args, operation));\n  } catch (error) {\n    if (error instanceof SyntaxError) throw new Error(`${operation}: invalid JSON response`);\n    throw error;\n  }\n}\nfunction comments(number) {\n  const pages = json([\'"\'"\'api\'"\'"\', `repos/${repo}/issues/${number}/comments?per_page=100`, \'"\'"\'--paginate\'"\'"\', \'"\'"\'--slurp\'"\'"\'], `read comments for issue ${number}`);\n  assert(Array.isArray(pages), \'"\'"\'Expected paginated comments\'"\'"\');\n  return pages.flat();\n}\n\nlet issueNumber;\nlet creationAttempted = false;\nlet failure;\ntry {\n  const issue = json([\'"\'"\'issue\'"\'"\', \'"\'"\'view\'"\'"\', \'"\'"\'4\'"\'"\', \'"\'"\'--repo\'"\'"\', repo, \'"\'"\'--json\'"\'"\', \'"\'"\'number,title,comments\'"\'"\'], \'"\'"\'read issue 4 via gh\'"\'"\');\n  assert.equal(issue.number, 4);\n  assert.equal(typeof issue.title, \'"\'"\'string\'"\'"\');\n  assert(issue.comments.length > 0, \'"\'"\'Expected existing comments in issue 4\'"\'"\');\n  const existingComments = comments(4);\n  assert(existingComments.length > 0, \'"\'"\'Expected issue 4 REST comments\'"\'"\');\n  assert.equal(typeof existingComments[0].body, \'"\'"\'string\'"\'"\');\n  console.log(`PASS: gh issue view #4 and REST comments (${existingComments.length}); issue #4 unchanged`);\n\n  const pages = json([\'"\'"\'api\'"\'"\', `repos/${repo}/issues?state=all&per_page=100`, \'"\'"\'--paginate\'"\'"\', \'"\'"\'--slurp\'"\'"\'], \'"\'"\'check for an existing smoke issue\'"\'"\');\n  assert(Array.isArray(pages), \'"\'"\'Expected paginated issues\'"\'"\');\n  assert(!pages.flat().some((issue) => !issue.pull_request && issue.title === title),\n    \'"\'"\'An issue with this exact smoke title already exists; refusing another creation\'"\'"\');\n\n  // Exactly one creation attempt; never retry on failure or an ambiguous result.\n  creationAttempted = true;\n  const issueUrl = gh([\'"\'"\'issue\'"\'"\', \'"\'"\'create\'"\'"\', \'"\'"\'--repo\'"\'"\', repo, \'"\'"\'--title\'"\'"\', title, \'"\'"\'--body\'"\'"\', body], \'"\'"\'create the single smoke issue\'"\'"\');\n  const match = /^https:\\/\\/github\\.com\\/shinovnikita\\/ai-for-developers-project-387\\/issues\\/(\\d+)$/.exec(issueUrl);\n  assert(match, \'"\'"\'Unexpected URL returned by gh issue create; do not retry creation\'"\'"\');\n  issueNumber = Number(match[1]);\n  assert.notEqual(issueNumber, 4, \'"\'"\'Smoke issue must differ from working issue 4\'"\'"\');\n  console.log(`PASS: created ${issueUrl}`);\n\n  const commentUrl = gh([\'"\'"\'issue\'"\'"\', \'"\'"\'comment\'"\'"\', String(issueNumber), \'"\'"\'--repo\'"\'"\', repo, \'"\'"\'--body\'"\'"\', commentBody], \'"\'"\'create the smoke comment\'"\'"\');\n  const createdComment = comments(issueNumber).find((comment) => comment.body === commentBody);\n  assert(createdComment, \'"\'"\'Smoke comment was not returned by REST\'"\'"\');\n  assert(/^https:\\/\\/github\\.com\\/shinovnikita\\/ai-for-developers-project-387\\/issues\\/\\d+#issuecomment-\\d+$/.test(commentUrl), \'"\'"\'Unexpected smoke comment URL\'"\'"\');\n  console.log(`PASS: created and read back ${commentUrl}`);\n} catch (error) {\n  failure = error;\n} finally {\n  // A failed CLI response can still follow a successful server write. Recover\n  // only for cleanup; there is never a second creation attempt.\n  if (creationAttempted && !issueNumber) {\n    try {\n      const pages = json([\'"\'"\'api\'"\'"\', `repos/${repo}/issues?state=all&per_page=100`, \'"\'"\'--paginate\'"\'"\', \'"\'"\'--slurp\'"\'"\'], \'"\'"\'recover a possibly created smoke issue\'"\'"\');\n      const matches = pages.flat().filter((issue) => !issue.pull_request && issue.title === title);\n      if (matches.length === 1 && matches[0].number !== 4) issueNumber = matches[0].number;\n    } catch (error) {\n      failure ??= error;\n    }\n  }\n  if (issueNumber) {\n    try {\n      gh([\'"\'"\'issue\'"\'"\', \'"\'"\'close\'"\'"\', String(issueNumber), \'"\'"\'--repo\'"\'"\', repo], \'"\'"\'close the smoke issue\'"\'"\');\n      const closed = json([\'"\'"\'issue\'"\'"\', \'"\'"\'view\'"\'"\', String(issueNumber), \'"\'"\'--repo\'"\'"\', repo, \'"\'"\'--json\'"\'"\', \'"\'"\'state\'"\'"\'], \'"\'"\'verify smoke issue closed\'"\'"\');\n      assert.equal(closed.state, \'"\'"\'CLOSED\'"\'"\');\n      console.log(`PASS: closed https://github.com/${repo}/issues/${issueNumber}`);\n    } catch (error) {\n      failure ??= error;\n    }\n  }\n}\nif (failure) {\n  console.error(`OpenCode auth smoke failed: ${failure.message}`);\n  process.exit(1);\n}\nconsole.log(\'"\'"\'OPENCODE_AUTH_SMOKE_PASS\'"\'"\');\n\''
          import json,os,time
          from pathlib import Path
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          class Mock(BaseHTTPRequestHandler):
           def log_message(self,*args):pass
           def do_POST(self):
            request=json.loads(self.rfile.read(int(self.headers['Content-Length'])))
            names={x['function']['name'] for x in request.get('tools',[])}
            results=[m for m in request.get('messages',[]) if m.get('role')=='tool']
            tool=None;args=None
            if 'read' in names and not results:
             tool='read';args={'filePath':os.environ['GITHUB_EVENT_PATH']}
            elif 'bash' in names and len(results)==1:
             assert 'rule which prevents' in json.dumps(results[0]),'Expected denied external read'
             tool='bash';args={'command':COMMAND,'description':'Verify gh read/write with existing App token','timeout':120000}
            elif 'bash' in names:
             assert len(results)==2 and 'OPENCODE_AUTH_SMOKE_PASS' in json.dumps(results[-1]),'gh auth smoke did not pass'
             Path(os.environ['RUNNER_TEMP']+'/opencode-smoke-pass').write_text('PASS: external read denied; gh read/create/comment/close from OpenCode tool\n')
            delta={'role':'assistant'}
            if tool:delta['tool_calls']=[{'index':0,'id':'call_'+str(len(results)),'type':'function','function':{'name':tool,'arguments':json.dumps(args)}}]
            else:delta['content']='OpenCode pre-merge tool smoke complete.'
            self.send_response(200);self.send_header('Content-Type','text/event-stream');self.end_headers()
            for chunk,finish in [(delta,None),({},'tool_calls' if tool else 'stop')]:
             value={'id':'chatcmpl-smoke','object':'chat.completion.chunk','created':int(time.time()),'model':'fake','choices':[{'index':0,'delta':chunk,'finish_reason':finish}]}
             self.wfile.write(('data: '+json.dumps(value)+'\n\n').encode());self.wfile.flush()
            self.wfile.write(b'data: [DONE]\n\n');self.wfile.flush()
          ThreadingHTTPServer(('127.0.0.1',4098),Mock).serve_forever()
          PY
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          # Exercise real OIDC/configureGit/session/tools with a deterministic model.
          # Route the wrapper as a repo event so it never comments on working issue #4.
          GITHUB_EVENT_NAME=workflow_dispatch timeout 180s opencode github run
          cat "$RUNNER_TEMP/opencode-smoke-pass"
          test -z "$(git status --porcelain)"
