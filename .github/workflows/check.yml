name: Check

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up mise and install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: '2026.11.0'
          cache: false

      - name: Install npm dependencies
        run: mise exec -- npm ci

      - name: Install Chromium and system dependencies
        run: mise exec -- npm exec -- playwright install --with-deps chromium

      - name: Run checks
        run: mise run check
