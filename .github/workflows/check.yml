name: Check

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise and install tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: '2026.11.0'
          cache: false

      - name: Install npm dependencies
        run: mise exec -- npm ci

      - name: Install Chromium and system dependencies
        run: mise exec -- npm exec -- playwright install --with-deps chromium

      - name: Run checks
        run: mise run check
